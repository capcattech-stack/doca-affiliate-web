name: Auto Sync Music from Google Drive to Cloudflare R2

on:
  schedule:
    # Chạy tự động lúc 00:00 hàng ngày (giờ UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Cho phép người dùng chạy thủ công từ giao diện Actions của GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth boto3

      - name: Run Drive to R2 Sync Script
        env:
          GD_SERVICE_ACCOUNT_JSON: ${{ secrets.GD_SERVICE_ACCOUNT_JSON }}
          GD_FOLDER_ID: ${{ vars.GD_FOLDER_ID }}
          R2_ACCESS_KEY_ID: ${{ vars.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ vars.R2_PUBLIC_DOMAIN }}
        run: |
          python scripts/sync_drive_to_r2.py
